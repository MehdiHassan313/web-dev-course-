<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form>
        <h1>Student Registration Form</h1>
        <br><br>

        <label>First Name:</label>
        <input type="text" id="fname" placeholder="Enter first name" required>
        <br><br>

        <label>Last Name:</label>
        <input type="text" id="lname" placeholder="Enter last name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter email" required>
        <br><br>

        <label>Password:</label>
        <input type="password" id="pswd" placeholder="Enter password" required>
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" id="ph" placeholder="Enter phone number">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" id="dob">
        <br><br>

        <label>Gender:</label>

        <input type="radio" name="gender" value="male">
        Male

        <input type="radio" name="gender" value="female">
        Female

        <input type="radio" name="gender" value="other">
        Other

        <br><br>

        <label>Hobbies:</label>
        <br>

        <input type="checkbox" name="hobbies" value="Coding">
        Coding

        <input type="checkbox" name="hobbies" value="Reading">
        Reading

        <input type="checkbox" name="hobbies" value="Scrolling">
        Scrolling

        <input type="checkbox" name="hobbies" value="Driving">
        Driving

        <br><br>

        <button type="submit" id="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

    <script src="/8 sep/script.js"></script>

</body>
</html>
