<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="/web dev/calculator/style.css">
</head>

<body>

    <div class="calculator">

        <div class="top">

            <h2>calc</h2>

            <div class="theme">
                THEME
                <span>1 2 3</span>
            </div>

        </div>


        <input type="text" id="display" >
        


        <div class="buttons">

            <button id="btn7" value="7">7</button>
            <button id="btn8" value="8">8</button>
            <button id="btn9" value="9">9</button>
            <button id="delete" class="delete">DEL</button>
            <button id="btn4" value="4">4</button>
            <button id="btn5" value="5">5</button>
            <button id="btn6" value="6">6</button>
            <button id="plus" value="+">+</button>
            <button id="btn1" value="1">1</button>
            <button id="btn2" value="2">2</button>
            <button id="btn3" value="3">3</button>
            <button id="minus" value="-">-</button>
            <button id="decimal" value=".">.</button>
            <button id="btn0" value="0">0</button>
            <button id="divide" value="/">/</button>
            <button id="multiply" value="*">×</button>


            <button id="reset" class="reset">
                RESET
            </button>

            <button id="equal" class="equal">
                =
            </button>

        </div>

    </div>


    <script src="/web dev/calculator/script.js"></script>

</body>

</html>
