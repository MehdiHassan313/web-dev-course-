    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Age Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2f2f2;
        }

        .counter {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #age {
            font-size: 40px;
            margin: 20px;
        }

        button {
            width: 50px;
            height: 50px;
            font-size: 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 5px;
            transition: 0.3s;
        }

        .minus {
            background-color: #ff5555;
            color: white;
        }

        .plus {
            background-color: #4CAF50;
            color: white;
        }

        button:hover {
            transform: scale(1.5);
        }

        #change {
                transition: all 0.5s ease;
}
    </style>
</head>

<body>

    <div class="counter">
        <h2>Increse Your Age</h2>
        <h2>Age Counter</h2>
        <button class="minus">-</button>
        <span id="age">1</span>
        <button class="plus">+</button>
        <p id="change"></p>

    </div>

    


    <script src="/web dev/7 sep/script.js"></script>

    </script>

</body>
</html>
</body>
</html>
