<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="/8 sep/style.css">
</head>
<body>

    <form>
        <h1>Student Registration Form</h1>

        <div class="form-grid">
            <div class="field">
                <label for="fname">First Name</label>
                <input type="text" id="fname" placeholder="Enter first name" required>
            </div>

            <div class="field">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" placeholder="Enter last name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email" required>
            </div>

            <div class="field">
                <label for="pswd">Password</label>
                <input type="password" id="pswd" placeholder="Enter password" required>
            </div>

            <div class="field">
                <label for="ph">Phone Number</label>
                <input type="tel" id="ph" placeholder="Enter phone number">
            </div>

            <div class="field">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">
            </div>

            <div class="field full-width">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
            </div>

            <div class="field full-width">
                <label>Hobbies</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="hobbies" value="Coding"> Coding</label>
                    <label><input type="checkbox" name="hobbies" value="Reading"> Reading</label>
                    <label><input type="checkbox" name="hobbies" value="Scrolling"> Scrolling</label>
                    <label><input type="checkbox" name="hobbies" value="Driving"> Driving</label>
                </div>
            </div>

            <div class="field full-width btn-group">
                <button type="submit" id="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
        </div>
    </form>

    <script src="script.js"></script>

</body>
</html>
