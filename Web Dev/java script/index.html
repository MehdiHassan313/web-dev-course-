<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="/script.js"></script>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: aqua ;
        }
    .container{
        background-color: black;
        color: white;
        height: 40%;
        width: 30%;
        border-radius: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
    }
.minus {
        background-color: rgb(165, 29, 29);
        color: white;
        height: 15%;
        width: 15%;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 40px;
        font-size: x-large;
        

    }
    .plus {
        background-color: rgb(165, 29, 29);
        color: white;
        height: 15%;
        width: 15%;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 40px;
        font-size: x-large;
            
        

    }
    </style>
</head>
<body>
    <div class="container">
        <button class="plus">+</button>
        <span id="number">0</span>
        <button class="minus">-</button>

    </div>
</body>
</html>
